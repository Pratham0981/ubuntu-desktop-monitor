[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dashboard-widget"
version = "0.1.0"
description = "Compact GNOME/Ubuntu desktop system monitor widget"
requires-python = ">=3.10"
dependencies = ["psutil"]

[project.scripts]
dashboard-widget = "dashboard.app:main"

[tool.setuptools.packages.find]
include = ["dashboard*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
